[project]
name = "hospital-resource-allocations"
version = "0.1.0"
description = "Hospital Resource Allocation Agent: synthetic data, deterministic environment, MCP server and evaluation"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
